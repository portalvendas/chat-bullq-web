<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Kortia">
  <defs>
    <linearGradient id="kTile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6B3BF5"/>
      <stop offset="1" stop-color="#3D1BA6"/>
    </linearGradient>
    <linearGradient id="kSpark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3BF5D0"/>
      <stop offset="1" stop-color="#17E8C0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#kTile)"/>
  <!-- K mark: stem + two arms (channels converging on the cortex node) -->
  <g fill="none" stroke="#FFFFFF" stroke-width="46" stroke-linecap="round" stroke-linejoin="round">
    <line x1="186" y1="150" x2="186" y2="362"/>
    <line x1="186" y1="258" x2="336" y2="150"/>
    <line x1="186" y1="258" x2="336" y2="362"/>
  </g>
  <!-- cortex node / IA spark -->
  <circle cx="336" cy="150" r="34" fill="url(#kSpark)"/>
  <circle cx="186" cy="258" r="20" fill="#FFFFFF"/>
</svg>
