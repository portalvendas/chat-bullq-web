name: Deploy Web (VPS)

# Auto-deploy no VPS a cada push na main (substitui o auto-deploy do Render).
# Conecta por SSH e roda o mesmo fluxo manual validado no handoff.
# ATENÇÃO: as NEXT_PUBLIC_* são gravadas NO BUILD (build-args do docker-compose),
# então todo push na main que mexe no front dispara um rebuild da imagem.
on:
  push:
    branches: [main]
  workflow_dispatch: {} # permite disparar manualmente pela aba Actions

# Nunca roda dois deploys ao mesmo tempo (evita recriar o container no meio
# de outro build). Não cancela o que já está rodando.
concurrency:
  group: deploy-web-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Se qualquer passo falhar (build quebrado etc.) o `up` não roda e o
          # container ANTIGO continua no ar.
          script_stop: true
          # Build do Next costuma demorar mais que o da API.
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd /opt/kortiacrm/web
            git fetch origin main
            git reset --hard origin/main   # garante a cópia do VPS == main (sem conflito)
            cd /opt/kortiacrm
            docker compose build kortiacrm-web
            docker compose up -d --no-deps kortiacrm-web
            docker image prune -f
            echo "Deploy OK — commit $(git -C /opt/kortiacrm/web rev-parse --short HEAD)"
